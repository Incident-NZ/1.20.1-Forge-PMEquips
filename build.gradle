plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets {
    npcTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.npcTest
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        npcTest {
            type = 'gameTestServer'
            sourceSet = sourceSets.npcTest
            gameDirectory = project.file('build/npc-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing',
                    file('src/main/resources').absolutePath
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            if (project.hasProperty('npcTests')) sourceSet sourceSets.npcTest
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    npcTestImplementation.extendsFrom implementation
    npcTestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    localRuntime "curse.maven:ato-405593:${alltheores_file}"
}

def replaceProperties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                         mod_authors: mod_authors, mod_license: mod_license,
                         mod_description: mod_description, neo_version: neo_version,
                         geckolib_version: geckolib_version, curios_version: curios_version]
tasks.named('processResources', ProcessResources) {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
    exclude '**/.cache/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version)
}
